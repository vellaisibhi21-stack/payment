version: v1
name: your-app-name

stages:
  planning:
    require_milestone: true
    require_issues_assigned: true

  development:
    branch: main
    deploy_target: dev
    required_checks:
      - "CI — Build & Test"
      - "Deployt to Dev"

  testing:
    branch_pattern: "release/**"
    deploy_target: staging
    required_checks:
      - "Deploy to Staging"

  evidencing:
    required_artifacts:
      - sdlc-evidence
      - test-results-staging
    required_reviewers:
      min_approvals: 1

  deployment:
    target: production
    required_checks:
      - "Deploy to Production"
    promotion: manual
    requires_evidence_approval: true
