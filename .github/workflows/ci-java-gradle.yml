# ── LaneSync-managed workflow ─────────────────────────────────────────────
# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "CI — Build & Test"

# Working Java (Gradle) CI — generated by LaneSync.
# Runs gradle test (JUnit 5 + JaCoCo), collects HTML reports, uploads evidence to LaneSync.

on:
  pull_request:
    branches: [ "main", "release/*" ]
  push:
    branches: [ "main", "release/*" ]
  release:
    types: [published]

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: wrapper     # uses gradle/wrapper/gradle-wrapper.properties if present
          add-job-summary: on-failure # only print Gradle summary on failure

      - name: Run unit tests
        run: |
          if [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            GRADLE_CMD="gradle"
            [ -f gradlew ] && chmod +x gradlew && GRADLE_CMD="./gradlew"
            $GRADLE_CMD test jacocoTestReport --no-daemon --continue || TEST_EXIT=$?
            mkdir -p coverage
            JACOCO_HTML="build/reports/jacoco/test/html"
            JACOCO_XML="build/reports/jacoco/test/jacocoTestReport.xml"
            [ -d "$JACOCO_HTML" ] && cp -r "$JACOCO_HTML/." coverage/ 2>/dev/null || true
            SUREFIRE_HTML=""
            for f in build/reports/tests/test/index.html; do
              [ -f "$f" ] && SUREFIRE_HTML="$f" && break
            done
            if [ -n "$SUREFIRE_HTML" ]; then
              echo "<html><body><h1>Unit Tests (Gradle)</h1><p>Full Gradle report: build/reports/tests/test/index.html in this artifact.</p></body></html>" > unit-tests.html
            else
              FIRST_XML=$(find build/test-results -name 'TEST-*.xml' -print -quit 2>/dev/null || true)
              CONTENT=$([ -n "$FIRST_XML" ] && cat "$FIRST_XML" | head -100 || echo 'no test results')
              echo "<html><body><h1>Unit Tests (Gradle)</h1><pre>${CONTENT}</pre></body></html>" > unit-tests.html
            fi
          else
            echo "No Gradle build file found — skipping Gradle build. Add a build.gradle to get started."
          fi
          [ -f unit-tests.html ] || echo "<html><body><h1>Unit Tests</h1><p>No tests yet — add a build.gradle and test suite to get started.</p></body></html>" > unit-tests.html
          mkdir -p coverage
          [ -f coverage/index.html ] || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure Gradle integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     ./gradlew integrationTest --no-daemon
      #     echo "<html><body><h1>Integration Tests</h1><pre>$(cat build/reports/tests/integrationTest/index.html 2>/dev/null | head -200)</pre></body></html>" > integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          # Scan source only: generated reports and build output are not the customer's code.
          opengrep scan --config auto --exclude .github --exclude coverage --exclude unit-tests.html \
            --exclude integration-tests.html --exclude build --exclude .gradle \
            --sarif -o sast.sarif . 2>/dev/null || true

      # Trivy reads Gradle dependencies only from gradle.lockfile. Without a committed
      # lockfile, resolve one for this run so the CVE scan covers the real dependency tree
      # (root project; commit your own lockfiles for multi-project builds).
      - name: Resolve Gradle lockfile for CVE scan
        if: always()
        run: |
          if { [ -f build.gradle ] || [ -f build.gradle.kts ]; } && [ ! -f gradle.lockfile ]; then
            GRADLE_CMD="gradle"
            [ -f gradlew ] && chmod +x gradlew && GRADLE_CMD="./gradlew"
            INIT="$RUNNER_TEMP/lanesync-dependency-locking.gradle"
            echo 'allprojects { dependencyLocking { lockAllConfigurations() } }' > "$INIT"
            $GRADLE_CMD --init-script "$INIT" dependencies --write-locks --no-daemon -q > /dev/null 2>&1 \
              || echo "::warning::Could not resolve a Gradle lockfile — CVE scan will not cover Gradle dependencies"
          fi

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW
          # Build output holds tool jars (JaCoCo agent, Gradle caches), not the app's dependencies.
          skip-dirs: build,.gradle

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            unit-tests.html
            integration-tests.html
            sast.sarif
            trivy.json
            build/test-results/
            build/reports/tests/
            build/reports/jacoco/
            coverage/
          retention-days: 30

      - name: Upload evidence to LaneSync
        uses: ./.github/actions/lanesync-upload
        if: always()
        with:
          api-url: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
          api-key: ${{ secrets.LANESYNC_API_KEY }}
          dev-branch: "main"
          release-prefix: "release/"
          pipeline: "CI — Build & Test"

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and Push Tag
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION=${BRANCH_NAME#release/}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEW_TAG"
            exit 0
          fi
          git tag "$NEW_TAG"
          if git push origin "$NEW_TAG"; then
            echo "Pushed tag: $NEW_TAG"
          else
            echo "GITHUB_TOKEN could not push ${NEW_TAG}. LaneSync creates it with the app installation token."
          fi
